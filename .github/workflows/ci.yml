name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Includes the wallet↔node conformance vectors (tests/conformance/vectors.json).
      - run: pnpm test:unit

  build-and-e2e:
    name: Build web + extension, end-to-end
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the Next static export (out/) and the Chrome/Firefox extensions (dist/).
      - run: pnpm extension:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm test:e2e
      # One artifact per browser, each with manifest.json at its root: unzipped, it is the
      # folder Chrome's "Load unpacked" takes; as is, the zip Firefox's about:debugging takes.
      - uses: actions/upload-artifact@v4
        with:
          name: qrdx-wallet-chrome
          path: dist/chrome
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: qrdx-wallet-firefox
          path: dist/firefox
          if-no-files-found: error

  # Artifacts need a GitHub login and expire, so main's builds are also published to the
  # `extension` release, whose download URLs never change. wallet.qrdx.org links to them
  # (src/web/downloads.ts).
  publish-extension:
    name: Publish extension builds
    runs-on: ubuntu-latest
    needs: build-and-e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    concurrency:
      group: publish-extension
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip each browser's build
        run: |
          (cd artifacts/qrdx-wallet-chrome && zip -qr ../../qrdx-wallet-chrome.zip .)
          (cd artifacts/qrdx-wallet-firefox && zip -qr ../../qrdx-wallet-firefox.zip .)
          sha256sum qrdx-wallet-chrome.zip qrdx-wallet-firefox.zip > SHA256SUMS
      - name: Update the extension release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          notes="QRDX Wallet ${version} for Chrome (and Brave, Edge) and Firefox, built by CI from ${GITHUB_SHA::7} on main.

          - **Chrome, Brave, Edge:** unzip qrdx-wallet-chrome.zip, open chrome://extensions, turn on Developer mode, click Load unpacked and choose the unzipped folder.
          - **Firefox:** open about:debugging#/runtime/this-firefox, click Load Temporary Add-on… and choose qrdx-wallet-firefox.zip. Firefox removes it when it restarts.

          Installation steps: https://wallet.qrdx.org/#download"
          # Move the tag to this commit, then replace the files in place: the URLs stay the same.
          git tag -f extension "$GITHUB_SHA"
          git push -f origin refs/tags/extension
          if gh release view extension >/dev/null 2>&1; then
            gh release upload extension qrdx-wallet-chrome.zip qrdx-wallet-firefox.zip SHA256SUMS --clobber
            gh release edit extension --title "Browser extension ${version}" --notes "$notes"
          else
            gh release create extension qrdx-wallet-chrome.zip qrdx-wallet-firefox.zip SHA256SUMS \
              --title "Browser extension ${version}" --notes "$notes" --prerelease
          fi
